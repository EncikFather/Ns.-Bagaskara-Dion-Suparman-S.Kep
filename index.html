function redraw(){drawRadar('radar',state.kp.items,'kepribadian');drawRadar('radar-sk',state.sk,'kemampuan',480)}
function drawRadar(id,items,name,W=360){
const el=$(id);if(!el)return;const it=items.filter(x=>x.pct!=null),n=it.length,cx=W/2,cy=135,R=84,M=W>400?24:18;
if(n<3){el.innerHTML='<p class="mu" style="text-align:center">Isi minimal 3 nilai untuk menampilkan grafik.</p>';return}
const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+r*Math.cos(a),cy+r*Math.sin(a),Math.cos(a),Math.sin(a)]};
let g=[20,40,60,80,100].map(k=>`<polygon class="rr" points="${it.map((_,i)=>pt(i,R*k/100).slice(0,2).join(',')).join(' ')}"/>`).join('');
g+=it.map((_,i)=>{const q=pt(i,R);return `<line class="rr" x1="${cx}" y1="${cy}" x2="${q[0]}" y2="${q[1]}"/>`}).join('');
const dp=it.map((x,i)=>pt(i,R*x.pct/100));
g+=`<polygon class="rd" points="${dp.map(q=>q[0]+','+q[1]).join(' ')}"/>`+dp.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3" fill="#fff"/>`).join('');
g+=it.map((x,i)=>{const q=pt(i,R+12),a=q[2]>.3?'start':q[2]<-.3?'end':'middle',t=x.label.length>M?x.label.slice(0,M-1)+'…':x.label;return `<text class="rl" x="${q[0]}" y="${q[1]+4+q[3]*7}" text-anchor="${a}">${esc(t)}</text>`}).join('');
el.innerHTML=`<svg viewBox="0 0 ${W} 270" role="img" aria-label="Grafik radar ${name}" style="width:100%;display:block">${g}</svg>`;
}

function applyEd(){const on=document.body.classList.contains('editing');document.querySelectorAll('.ed').forEach(e=>e.contentEditable=on)}
let st;function save(){clearTimeout(st);st=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify({base:DATA.version,data:state}))}catch(e){toast('Penyimpanan browser penuh. Klik Unduh HTML agar perubahan tidak hilang.')}},400)}

const PASSWORD='GantiPassword#2026';

async function imgData(file,max,crop){
let bm;try{bm=await createImageBitmap(file)}catch(e){throw Error('Format gambar tidak didukung. Gunakan JPG atau PNG.')}
let sx=0,sy=0,sw=bm.width,sh=bm.height;
if(crop){const w=Math.min(sw,sh*3/4),h=w*4/3;sx=(sw-w)/2;sy=(sh-h)/2;sw=w;sh=h}
const k=Math.min(1,max/Math.max(sw,sh)),c=document.createElement('canvas');c.width=Math.round(sw*k);c.height=Math.round(sh*k);
const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,sx,sy,sw,sh,0,0,c.width,c.height);
return c.toDataURL('image/jpeg',.85)}
const fileData=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(Error('Gagal membaca file.'));r.readAsDataURL(f)});
document.addEventListener('change',async e=>{
if(e.target.dataset.pct!==undefined&&reflow){reflow=false;render();return}
const i=e.target.closest('input[data-up]');if(!i||!i.files[0]||!document.body.classList.contains('editing'))return;
const f=i.files[0],p=i.dataset.up,photo=i.dataset.k==='photo';i.value='';
try{
if(i.dataset.push){if(!f.type.startsWith('image/'))throw Error('Hanya file gambar (JPG/PNG).');get(p).push(await imgData(f,1200,false))}
else if(photo){set(p,await imgData(f,600,true))}
else if(f.type.startsWith('image/')){set(p,{name:f.name,type:'image/jpeg',data:await imgData(f,1600,false)})}
else if(f.type==='application/pdf'){if(f.size>3e6)throw Error('PDF maksimal 3 MB. Kompres dulu atau unggah sebagai foto/scan JPG.');set(p,{name:f.name,type:f.type,data:await fileData(f)})}
else throw Error('Hanya file gambar (JPG/PNG) atau PDF.');
save();render()}catch(err){toast(err.message)}});

document.addEventListener('input',e=>{const t=e.target;if(!document.body.classList.contains('editing'))return;
if(t.dataset.pct!==undefined){const k=t.dataset.pct,x=get(k),v=t.value===''?null:Math.max(0,Math.min(100,Math.round(+t.value))),r=document.querySelector(`[data-r="${k}"]`);
if(k.startsWith('kp')&&(x.pct==null)!==(v==null))reflow=true;x.pct=v;
r.querySelectorAll('[data-pct]').forEach(n=>{if(n!==t)n.value=v??(n.type==='range'?0:'')});
const pv=r.querySelector('.pv');if(pv)pv.textContent=v==null?'':v+'%';const fl=r.querySelector('.fill');if(fl)fl.style.width=(v||0)+'%';redraw();save();return}
if(t.classList.contains('ed')){set(t.dataset.p,t.textContent);redraw();save()}});
document.addEventListener('focusout',e=>{const t=e.target;if(t.classList&&t.classList.contains('ed')&&document.body.classList.contains('editing')){const v=t.textContent.trim();set(t.dataset.p,v);t.textContent=v;save()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('ed')){e.preventDefault();e.target.blur()}if(e.key==='Escape'){closeDoc();$('mn').classList.remove('open')}});
document.addEventListener('paste',e=>{if(e.target.classList&&e.target.classList.contains('ed')){e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text').replace(/\s*\n\s*/g,' '))}});

async function openDoc(f){const ext=/^https?:/i.test(f.data),u=ext?f.data:URL.createObjectURL(await (await fetch(f.data)).blob()),m=$('modal');
m.innerHTML=`<div class="mb"><div class="mh"><span>${esc(f.name)}</span><a class="btn" href="${esc(f.open||u)}" target="_blank" rel="noopener">Buka di tab baru</a><button class="btn" data-act="close">Tutup</button></div>${f.type==='application/pdf'||f.type==='drive'?`<iframe src="${u}" title="Dokumen"></iframe>`:`<img src="${esc(u)}" alt="Dokumen" referrerpolicy="no-referrer">`}</div>`;m._u=ext?null:u;m.hidden=false}
function closeDoc(){const m=$('modal');if(m._u)URL.revokeObjectURL(m._u);m._u=null;m.hidden=true;m.innerHTML=''}
function setEdit(on){if(on&&!document.body.classList.contains('owner'))return;document.body.classList.toggle('editing',on);applyEd()}

/* Efek cahaya Tron: garis biru-putih berjalan acak mengikuti garis kotak latar */
(function(){
const cv=document.getElementById('tron');
if(!cv||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches))return;
const ctx=cv.getContext('2d');if(!ctx)return;
const G=44,MAXA=.5,rnd=(a,b)=>a+Math.random()*(b-a);
const D1=[[-26,15],[26,15],[0,-30]],D2=[[-26,-15],[26,-15],[0,30]];
const dirsAt=(x,y)=>{const m=((Math.round(y)%90)+90)%90;return (m===0||m===45)?D1:D2};
let W=0,H=0,cs=[],last=0;
function spawn(c,first){
 c.hx=26+52*Math.floor(rnd(0,W/52));c.hy=90*Math.floor(rnd(0,H*.7/90));
 const d=dirsAt(c.hx,c.hy)[Math.floor(rnd(0,3))];
 c.dx=d[0];c.dy=d[1];c.len=Math.hypot(d[0],d[1]);c.rem=c.len;
 c.tx=c.hx+d[0];c.ty=c.hy+d[1];c.pts=[{x:c.hx,y:c.hy}];
 c.L=rnd(150,280);c.speed=rnd(70,130);c.wait=first?rnd(0,3):rnd(.5,4);c.fade=0}
function size(){
 const r=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 cv.width=W*r;cv.height=H*r;ctx.setTransform(r,0,0,r,0,0);
 const n=Math.max(10,Math.min(10,Math.round(W*H/90000)));
 cs=Array.from({length:n},()=>{const c={};spawn(c,true);return c})}
function step(c,dt){
 if(c.wait>0){c.wait-=dt;return}
 c.fade=Math.min(1,c.fade+dt*1.5);
 let d=c.speed*dt;
 while(d>0){
  const m=Math.min(d,c.rem),k=m/c.len;c.hx+=c.dx*k;c.hy+=c.dy*k;c.rem-=m;d-=m;
  if(c.rem<=1e-6){
   c.hx=c.tx;c.hy=c.ty;c.pts.push({x:c.hx,y:c.hy});
   const o=dirsAt(c.hx,c.hy).filter(v=>!(v[0]===-c.dx&&v[1]===-c.dy)),n=o[Math.floor(rnd(0,2))];
   c.dx=n[0];c.dy=n[1];c.len=Math.hypot(n[0],n[1]);c.rem=c.len;c.tx=c.hx+n[0];c.ty=c.hy+n[1]}}
 if(c.hx<-G||c.hx>W+G||c.hy<-G||c.hy>H*.85){spawn(c,false);return}
 const path=c.pts.concat([{x:c.hx,y:c.hy}]);let tot=0;
 for(let i=1;i<path.length;i++)tot+=Math.hypot(path[i].x-path[i-1].x,path[i].y-path[i-1].y);
 let ex=tot-c.L;
 while(ex>0&&c.pts.length>0){
  const a=c.pts[0],b=c.pts.length>1?c.pts[1]:{x:c.hx,y:c.hy},s=Math.hypot(b.x-a.x,b.y-a.y);
  if(s<=ex&&c.pts.length>1){c.pts.shift();ex-=s}
  else{if(s>0){a.x+=(b.x-a.x)*ex/s;a.y+=(b.y-a.y)*ex/s}break}}}
const col=(d,L,a)=>{const t=Math.min(1,d/L);return `rgba(${Math.round(255-195*t)},${Math.round(255-95*t)},255,${a})`};
function draw(c){
 if(c.wait>0)return;
 const path=c.pts.concat([{x:c.hx,y:c.hy}]),L=c.L,al=d=>MAXA*c.fade*Math.pow(Math.max(0,1-d/L),1.5);
 ctx.lineWidth=1.6;ctx.lineCap='round';ctx.lineJoin='round';
 ctx.shadowBlur=8;ctx.shadowColor='rgba(70,160,255,.4)';
 let dist=0;
 for(let i=path.length-1;i>0;i--){
  const a=path[i],b=path[i-1],len=Math.hypot(a.x-b.x,a.y-b.y);if(len<.01)continue;
  const g=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
  g.addColorStop(0,col(dist,L,al(dist)));g.addColorStop(1,col(dist+len,L,al(dist+len)));
  ctx.strokeStyle=g;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();dist+=len}
 ctx.shadowBlur=10;ctx.fillStyle=`rgba(255,255,255,${.8*c.fade})`;
 ctx.beginPath();ctx.arc(c.hx,c.hy,1.8,0,6.2832);ctx.fill();ctx.shadowBlur=0}
function frame(t){
 const dt=Math.min(.05,(t-last)/1000||0);last=t;
 ctx.clearRect(0,0,W,H);
 for(const c of cs){step(c,dt);draw(c)}
 requestAnimationFrame(frame)}
size();addEventListener('resize',size);requestAnimationFrame(frame);
})();
</script>
